name: Sync Cloudflare Pages secrets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-cloudflare-secrets.yml
      - functions/api/admin/login.js
      - README.md

permissions:
  contents: read

jobs:
  sync-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PAGES_PROJECT ADMIN_PASSWORD SESSION_SECRET; do
            if [[ -z "${!name}" ]]; then
              printf 'Missing GitHub secret or variable: %s\n' "$name" >&2
              exit 1
            fi
          done

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Sync runtime secrets to Pages
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          set -euo pipefail
          printf '%s' "$ADMIN_PASSWORD" | wrangler pages secret put ADMIN_PASSWORD --project-name "$CLOUDFLARE_PAGES_PROJECT"
          printf '%s' "$SESSION_SECRET" | wrangler pages secret put SESSION_SECRET --project-name "$CLOUDFLARE_PAGES_PROJECT"
